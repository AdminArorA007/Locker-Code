<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo Chat</title>
<style>
  :root{--bg:#fff;--fg:#1a1a1a;--card:#f2f2f2;--me:#2f7d5b;--accent:#2f7d5b}
  @media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--card:#222}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{padding:12px 16px;font-weight:600;display:flex;justify-content:space-between}
  #status{font-weight:400;font-size:.85rem;opacity:.7}
  main{flex:1;overflow-y:auto;padding:0 16px 16px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:1rem;margin:4px 4px 4px 0}
  textarea,input{width:100%;background:var(--card);color:var(--fg);border:0;border-radius:8px;padding:10px;font-size:1rem}
  .box{background:var(--card);border-radius:8px;padding:10px;word-break:break-all;font-size:.8rem;margin:8px 0;max-height:90px;overflow:auto}
  #chat{display:none;flex-direction:column;flex:1;min-height:0}
  #log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:0 16px}
  .m{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--card);align-self:flex-start;white-space:pre-wrap}
  .m.me{background:var(--me);color:#fff;align-self:flex-end}
  #bar{display:flex;gap:6px;padding:10px 16px}
  #bar button{margin:0}
</style>
</head>
<body>
<header>Duo Chat <span id="status">not connected</span></header>

<main id="setup">
  <p>Chat directly with one person. No server, nothing stored online.</p>
  <h3>Step 1: one person starts</h3>
  <button id="btnInvite">Create invite</button>
  <div id="inviteOut" style="display:none">
    <div class="box" id="inviteLink"></div>
    <button id="btnShareInvite">Share on WhatsApp</button>
    <p>Step 3: when your friend sends a reply link, paste it here:</p>
    <input id="replyIn" placeholder="Paste reply link">
    <button id="btnFinish">Connect</button>
  </div>
  <div id="replyOut" style="display:none">
    <h3>Step 2: send this reply back</h3>
    <div class="box" id="replyLink"></div>
    <button id="btnShareReply">Share on WhatsApp</button>
  </div>
  <h3>Got an invite link?</h3>
  <input id="joinIn" placeholder="Paste invite link (or just open it)">
  <button id="btnJoin">Join</button>
  <p id="msg"></p>
</main>

<section id="chat">
  <div id="log"></div>
  <div id="bar"><input id="txt" placeholder="Message"><button id="btnSend">Send</button></div>
</section>

<script>
const $ = id => document.getElementById(id);
const BASE = location.href.split('#')[0];
let pc, dc;

// ---------- packing: object -> short text (compress + base64url) ----------
async function pack(obj){
  const s = new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  const bytes = new Uint8Array(await new Response(s).arrayBuffer());
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpack(text){
  const b64 = text.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return JSON.parse(await new Response(s).text());
}
// accepts a full link or a bare code
const extract = t => t.trim().replace(/^.*#[oa]=/, '');

// ---------- WebRTC ----------
function newPC(){
  pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  pc.onconnectionstatechange = () => { $('status').textContent = pc.connectionState; };
}
function waitIce(){
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && res();
    setTimeout(res, 4000);
  });
}
function setupChannel(){
  dc.onopen = async () => {
    $('setup').style.display = 'none';
    $('chat').style.display = 'flex';
    addMsg('Connected. Safety code: ' + await safetyCode() + ' (compare it with your friend)', 'sys');
  };
  dc.onmessage = e => addMsg(e.data, 'them');
  dc.onclose = () => addMsg('Disconnected.', 'sys');
}

async function createInvite(){
  newPC();
  dc = pc.createDataChannel('chat'); setupChannel();
  await pc.setLocalDescription(await pc.createOffer());
  await waitIce();
  $('inviteLink').textContent = BASE + '#o=' + await pack(pc.localDescription);
  $('inviteOut').style.display = 'block';
}
async function join(code){
  try{
    newPC();
    pc.ondatachannel = e => { dc = e.channel; setupChannel(); };
    await pc.setRemoteDescription(await unpack(code));
    await pc.setLocalDescription(await pc.createAnswer());
    await waitIce();
    $('replyLink').textContent = BASE + '#a=' + await pack(pc.localDescription);
    $('replyOut').style.display = 'block';
  }catch(e){ $('msg').textContent = 'That invite looks invalid or expired.'; }
}
async function finish(code){
  try{ await pc.setRemoteDescription(await unpack(code)); }
  catch(e){ $('msg').textContent = 'That reply looks invalid. Start again.'; }
}

// short number both phones can compare (derived from both DTLS fingerprints)
async function safetyCode(){
  const fp = d => (d.sdp.match(/a=fingerprint:\S+ (\S+)/) || [])[1] || '';
  const joined = [fp(pc.localDescription), fp(pc.remoteDescription)].sort().join();
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(joined)));
  const n = ((h[0]<<24 | h[1]<<16 | h[2]<<8 | h[3]) >>> 0) % 1000000;
  return String(n).padStart(6, '0');
}

// ---------- chat UI ----------
function addMsg(text, who, save = true){
  const d = document.createElement('div');
  d.className = 'm ' + (who === 'me' ? 'me' : '');
  if (who === 'sys'){ d.style.alignSelf = 'center'; d.style.opacity = .6; d.style.fontSize = '.8rem'; }
  d.textContent = text;
  $('log').appendChild(d); $('log').scrollTop = 1e9;
  if (save && who !== 'sys'){
    try{
      const h = JSON.parse(localStorage.getItem('history') || '[]');
      h.push([who, text]); localStorage.setItem('history', JSON.stringify(h.slice(-200)));
    }catch(e){}
  }
}
function send(){
  const t = $('txt').value.trim();
  if (!t || !dc || dc.readyState !== 'open') return;
  dc.send(t); addMsg(t, 'me'); $('txt').value = '';
}
async function share(text){
  if (navigator.share) { try{ await navigator.share({text}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(text); $('msg').textContent = 'Copied. Paste it into WhatsApp.'; }catch(e){}
}

$('btnInvite').onclick = createInvite;
$('btnShareInvite').onclick = () => share('Join my private chat: ' + $('inviteLink').textContent);
$('btnShareReply').onclick = () => share('Here is my reply: ' + $('replyLink').textContent);
$('btnFinish').onclick = () => finish(extract($('replyIn').value));
$('btnJoin').onclick = () => join(extract($('joinIn').value));
$('btnSend').onclick = send;
$('txt').onkeydown = e => { if (e.key === 'Enter') send(); };

// opened via link?
const h = location.hash;
if (h.startsWith('#o=')) join(h.slice(3));
else if (h.startsWith('#a=')){
  if (pc) finish(h.slice(3));
  else { $('replyIn').value = location.href; $('msg').textContent = 'Reply link received. Create an invite first, then paste it in Step 3.'; }
}
</script>
</body>
</html>
